name: 🧪 QA-Pruebas - Filtro Automático

# ─────────────────────────────────────────────────────────────────────────────
# Se ejecuta cuando se hace push o PR a la rama QA-Pruebas.
# Si los tests FALLAN → el merge a main queda BLOQUEADO.
# Si los tests PASAN  → el merge a main está habilitado.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - QA-Pruebas
  pull_request:
    branches:
      - QA-Pruebas   # cuando feature/* quiere entrar a QA-Pruebas
      - main          # cuando QA-Pruebas quiere entrar a main

jobs:
  pruebas-automaticas:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # 2. Configurar .NET
      - name: ⚙️ Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar dependencias
      - name: 📦 Restaurar paquetes
        run: dotnet restore

      # 4. Compilar la solución
      - name: 🔨 Compilar
        run: dotnet build --no-restore --configuration Release

      # 5. Ejecutar pruebas (si falla → bloquea el merge)
      - name: 🧪 Ejecutar pruebas unitarias
        run: dotnet test Calcualdora.Tests/Calcualdora.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.xml" --verbosity normal

      # 6. Publicar resultados (visible en GitHub Actions UI)
      - name: 📊 Publicar resultados de pruebas
        uses: dorny/test-reporter@v1
        if: always()   # mostrar resultados aunque fallen
        with:
          name: Resultados xUnit
          path: '**/test-results.xml'
          reporter: dotnet-trx
          fail-on-error: true
